[package]
name = "boatmath-web"
version = "0.1.0"
edition = "2021"
description = "boatmath: hulls, cases and a queue of studies, on the thin-ship and seakeeping solvers"
license = "MIT"

[[bin]]
name = "boatmath-web"
path = "src/main.rs"

[dependencies]
boatmath = { path = "../boatmath" }
flate2 = "1.1.10"
thinship = { path = "../thinship" }
hullgeom = { path = "../hullgeom" }
seakeeping = { path = "../seakeeping" }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
tiny_http = "0.12"
