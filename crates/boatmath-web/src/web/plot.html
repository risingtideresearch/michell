<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plot · boatmath</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/static/common.css">
<style>
  .filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; margin-bottom: 14px; }
  .filters label { min-width: 150px; }
  .filters label.check { min-width: 0; flex-direction: row; align-items: center; gap: 6px; color: var(--ink); font-size: 13px; padding-bottom: 6px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 16px; }
  .axes { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; margin-bottom: 8px; }
  .axes label { min-width: 200px; }
  td.what { white-space: normal; min-width: 240px; }
  .hidden-note { font-size: 12px; color: var(--warn); margin-top: 6px; }
</style>
</head>
<body>
<div class="page"><div class="inner">
  <div class="head">
    <h1>Plot</h1>
    <span class="counts" id="counts"></span>
    <span class="grow"></span>
    <button id="csv">Download CSV</button>
  </div>
  <div class="filters">
    <label>Hull <select id="hull"><option value="">all hulls</option></select></label>
    <label>Case <select id="case"><option value="">all</option></select></label>
    <label>Water <select id="kind"><option value="calm">calm water</option><option value="waves">waves</option></select></label>
    <label id="headlabel">Heading <select id="heading"><option value="">all</option></select></label>
    <label class="check"><input type="checkbox" id="stale" checked> include stale results</label>
  </div>
  <div id="status"></div>
  <div class="panel">
    <div class="axes">
      <label>Plot <select id="y"></select></label>
      <label>against <select id="x"></select></label>
    </div>
    <div id="plot"></div>
    <div class="hidden-note" id="hidden"></div>
  </div>
  <div id="table"></div>
</div></div>

<script type="module">
import { $, KN, api, caseName, esc, fmt, headingText, lRef, nav, studyLabel, status } from "/static/common.js";
import { lineChart, slot } from "/static/chart.js";
nav("plot");

// What can be plotted, per kind: each a label and how to read it off a study.
const Y = {
  calm: {
    rt: ["Total resistance R_t [N]", (r) => r.result.scalars.rt],
    rw: ["Wave resistance R_w [N]", (r) => r.result.scalars.rw],
    rv: ["Viscous resistance R_v [N]", (r) => r.result.scalars.rv],
    pe: ["Effective power [kW]", (r) => r.result.scalars.pe / 1000],
    ct: ["C_t ×10³", (r) => 1000 * r.result.scalars.ct],
    cw: ["C_w ×10³", (r) => 1000 * r.result.scalars.cw],
    sinkage: ["Sinkage [mm]", (r) => 1000 * r.result.scalars.sinkage],
    trim: ["Trim [°, bow up]", (r) => r.result.scalars.trim_deg],
    lift: ["Dynamic lift [% of weight]", (r) => 100 * r.result.scalars.lift_fraction],
    rt_per_t: ["R_t per tonne [N/t]", (r) => r.result.scalars.rt / (r.result.scalars.mass / 1000)],
  },
  waves: {
    heave_peak: ["Peak heave |η₃|/ζ", (r) => r.result.scalars.heave_peak],
    pitch_peak: ["Peak pitch |η₅|/ζ [rad/m]", (r) => r.result.scalars.pitch_peak],
    roll_peak: ["Peak roll |η₄|/ζ [rad/m]", (r) => r.result.scalars.roll_peak],
    added_resistance_peak: ["Peak added resistance R_aw/ζ² [N/m²] (GB)", (r) => r.result.scalars.added_resistance_peak],
    sea_heave: ["Significant heave in the sea [m]", (r) => r.result.scalars.sea_heave],
    sea_pitch_deg: ["Significant pitch in the sea [°]", (r) => r.result.scalars.sea_pitch_deg],
    sea_accel_bow: ["Significant bow acceleration [m/s²]", (r) => r.result.scalars.sea_accel_bow],
    sea_raw_gb: ["Added resistance in the sea [N] (GB)", (r) => r.result.scalars.sea_raw_gb],
  },
};
// The x-axes: `case` marks a property of the case (so the series
// are then speeds, not cases).
const X = {
  knots: ["Speed [kn]", (r) => r.result.scalars.speed / KN],
  froude: ["Froude number", (r) => r.params.froude],
  speed: ["Speed [m/s]", (r) => r.result.scalars.speed],
  mass: ["Mass [kg]", (r) => r.result.scalars.mass ?? r.case.mass, true],
  span: ["Catamaran span [m]", (r) => r.case.span, true],
  lcg: ["LCG [m]", (r) => r.result.scalars.lcg ?? r.case.lcg, true],
  vcg: ["VCG above DWL [m]", (r) => r.case.vcg ?? 0, true],
  heading: ["Heading [°]", (r) => r.params.waves?.heading],
};

let studies = [], lengths = new Map(), cases = [];
const qs = new URLSearchParams(location.search);

function options(sel, entries, keep) {
  sel.innerHTML = entries.map(([v, t]) => `<option value="${esc(v)}">${esc(t)}</option>`).join("");
  if (keep != null && [...sel.options].some((o) => o.value === keep)) sel.value = keep;
}

function fillAxes() {
  const kind = $("kind").value;
  options($("y"), Object.entries(Y[kind]).map(([k, v]) => [k, v[0]]), qs.get("y"));
  const xs = Object.entries(X).filter(([k]) => kind === "waves" || k !== "heading");
  options($("x"), xs.map(([k, v]) => [k, v[0]]), qs.get("x"));
  $("headlabel").hidden = kind !== "waves";
}

// The studies shown: fetched for the server-side filters, then by heading and
// staleness here.
function shown() {
  const h = $("heading").value;
  return studies.filter((r) => r.result && r.kind === $("kind").value
    && ($("stale").checked || !r.result.stale)
    && (!h || String(r.params.waves?.heading) === h));
}

function seriesOf(r, xk) {
  const l = lengths.get(r.hull_id);
  const byCase = !X[xk][2];
  const heading = r.kind === "waves" && xk !== "heading" ? ` · ${headingText(r.params.waves.heading)}` : "";
  if (byCase) {
    const key = `c${r.case_id}${heading}`;
    return { key, entity: r.case_id * 1000 + (r.params.waves?.heading ?? 0), name: `${caseName({ name: r.case_name, params: r.case })}${heading}` };
  }
  const kn = l ? ` (${fmt(r.params.froude * Math.sqrt(9.81 * l) / KN, 1)} kn)` : "";
  return { key: `f${r.params.froude}${heading}`, entity: r.params.froude * 1e6 + (r.params.waves?.heading ?? 0), name: `Fn ${fmt(r.params.froude, 3)}${kn}${heading}` };
}

function draw() {
  const kind = $("kind").value, yk = $("y").value, xk = $("x").value;
  const [ylab, fy] = Y[kind][yk], [xlab, fx] = X[xk];
  const rs = shown();
  // Series by entity, coloured in a fixed order of entity (never by rank).
  const groups = new Map();
  for (const r of rs) {
    const x = fx(r), y = fy(r);
    if (x == null || y == null || !Number.isFinite(x) || !Number.isFinite(y)) continue;
    const s = seriesOf(r, xk);
    if (!groups.has(s.key)) groups.set(s.key, { ...s, points: [] });
    groups.get(s.key).points.push([x, y, r.id]);
  }
  const all = [...groups.values()].sort((a, b) => a.entity - b.entity);
  const series = all.slice(0, 8).map((g, i) => ({ name: g.name, points: g.points, color: slot(i) }));
  $("hidden").textContent = all.length > 8 ? `${all.length - 8} more series not drawn: filter by hull or case to see them.` : "";
  lineChart($("plot"), {
    title: ylab, series,
    x: { label: xlab, fmt: (v) => (+v.toPrecision(4)).toString() },
    y: { label: ylab, fmt: (v) => (+v.toPrecision(3)).toString() },
    onPick: (id) => { location.href = `/studies/${id}`; },
    empty: "No finished studies match",
    marks: "always",
    height: 320,
  });
  renderTable(rs);
  const q = new URLSearchParams();
  for (const k of ["hull", "case", "kind", "heading", "y", "x"]) if ($(k).value) q.set(k, $(k).value);
  if (!$("stale").checked) q.set("stale", "0");
  history.replaceState(null, "", `/plot?${q}`);
}

function columns(kind) {
  return kind === "calm"
    ? [["R_t [N]", (s) => fmt(s.rt, 1)], ["R_w [N]", (s) => fmt(s.rw, 1)], ["R_v [N]", (s) => fmt(s.rv, 1)], ["P_E [kW]", (s) => fmt(s.pe / 1000, 2)], ["Sinkage [mm]", (s) => fmt(1000 * s.sinkage, 1)], ["Trim [°]", (s) => fmt(s.trim_deg, 3)]]
    : [["Heave peak", (s) => fmt(s.heave_peak, 3)], ["at λ/L", (s) => fmt(s.heave_peak_lambda, 2)], ["Pitch peak", (s) => fmt(s.pitch_peak, 3)], ["R_aw peak", (s) => fmt(s.added_resistance_peak, 0)], ["Sea heave [m]", (s) => fmt(s.sea_heave, 3)], ["Sea bow accel", (s) => fmt(s.sea_accel_bow, 2)]];
}

function renderTable(rs) {
  const kind = $("kind").value, cols = columns(kind);
  $("counts").innerHTML = `<span class="pill done">${rs.length} study${rs.length === 1 ? "" : "s"}</span>${rs.some((r) => r.result.stale) ? `<span class="pill stale">${rs.filter((r) => r.result.stale).length} stale</span>` : ""}`;
  if (!rs.length) { $("table").innerHTML = ""; return; }
  $("table").innerHTML = `<div class="tablewrap"><table><thead><tr>
    <th class="num">#</th><th>Hull › case</th><th>Study</th>${cols.map(([h]) => `<th class="num">${esc(h)}</th>`).join("")}
  </tr></thead><tbody>${rs.map((r) => {
    const s = r.result.scalars;
    return `<tr class="link" data-id="${r.id}">
      <td class="num"><a href="/studies/${r.id}">${r.id}</a></td>
      <td class="what"><a href="/hulls/${r.hull_id}">${esc(r.hull_name)}</a> › <a href="/cases/${r.case_id}">${esc(caseName({ name: r.case_name, params: r.case }))}</a></td>
      <td class="what">${esc(studyLabel(r.params, lengths.get(r.hull_id)))}${r.result.stale ? ` <span class="pill stale">stale</span>` : ""}</td>
      ${cols.map(([, f]) => `<td class="num">${f(s)}</td>`).join("")}
    </tr>`;
  }).join("")}</tbody></table></div>`;
}
$("table").addEventListener("click", (e) => {
  if (e.target.closest("a")) return;
  const row = e.target.closest("tr.link");
  if (row) location.href = `/studies/${row.dataset.id}`;
});

// Every scalar of the shown studies, with what they were run on.
$("csv").onclick = () => {
  const rs = shown();
  const keys = [...new Set(rs.flatMap((r) => Object.keys(r.result.scalars)))].sort();
  const cfgKeys = ["span", "mass", "mass_by", "lcg", "vcg", "kxx", "kyy", "kzz", "roll_damping"];
  const head = ["study", "hull", "case", "case_name", ...cfgKeys.map((k) => `case_${k}`), "froude", "dynamic", "heading", "stale", "solver_version", ...keys];
  const cell = (v) => v == null ? "" : typeof v === "string" && /[",\n]/.test(v) ? `"${v.replace(/"/g, '""')}"` : String(v);
  const lines = [head.join(",")].concat(rs.map((r) => [r.id, r.hull_name, r.case_id, r.case_name, ...cfgKeys.map((k) => r.case[k]),
    r.params.froude, r.params.dynamic, r.params.waves?.heading, r.result.stale, r.result.solver_version, ...keys.map((k) => r.result.scalars[k])].map(cell).join(",")));
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([lines.join("\n") + "\n"], { type: "text/csv" }));
  a.download = `boatmath-results-${$("kind").value}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
};

async function fetchRuns() {
  const q = new URLSearchParams({ status: "done" });
  for (const k of ["hull", "case", "kind"]) if ($(k).value) q.set(k, $(k).value);
  studies = await api(`/api/studies?${q}`);
  const heads = [...new Set(studies.filter((r) => r.kind === "waves").map((r) => r.params.waves.heading))].sort((a, b) => a - b);
  options($("heading"), [["", "all"], ...heads.map((h) => [String(h), headingText(h)])], qs.get("heading") ?? $("heading").value);
  draw();
}

function fillCases() {
  const h = Number($("hull").value);
  const cs = cases.filter((c) => !h || c.hull_id === h);
  options($("case"), [["", "all"], ...cs.map((c) => [String(c.id), `${c.hull_name} › ${caseName(c)}`])], qs.get("case") ?? $("case").value);
}

for (const k of ["hull", "case", "kind"]) $(k).addEventListener("change", () => {
  qs.delete(k); qs.delete("y"); qs.delete("x");
  if (k === "hull") { qs.delete("case"); fillCases(); }
  if (k === "kind") fillAxes();
  fetchRuns().catch((e) => status(e.message, true));
});
for (const k of ["heading", "y", "x"]) $(k).addEventListener("change", () => { qs.delete(k); draw(); });
$("stale").addEventListener("change", draw);

try {
  const [hulls, cs] = await Promise.all([api("/api/hulls"), api("/api/cases")]);
  lengths = new Map(hulls.map((h) => [h.id, lRef(h.summary)]));
  cases = cs;
  options($("hull"), [["", "all hulls"], ...hulls.map((h) => [String(h.id), h.name])], qs.get("hull"));
  // A case given alone picks its hull.
  if (qs.get("case") && !qs.get("hull")) {
    const c = cases.find((c) => String(c.id) === qs.get("case"));
    if (c) $("hull").value = String(c.hull_id);
  }
  fillCases();
  if (qs.get("kind")) $("kind").value = qs.get("kind");
  $("stale").checked = qs.get("stale") !== "0";
  fillAxes();
  await fetchRuns();
} catch (e) { status(e.message, true); }
</script>
</body>
</html>
