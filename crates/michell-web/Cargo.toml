[package]
name = "michell-web"
version = "0.1.0"
edition = "2021"
description = "Web front end for michell: upload a hull file, view the loft"
license = "MIT"

[[bin]]
name = "michell-web"
path = "src/main.rs"

[dependencies]
flate2 = "1.1.10"
michell = { path = "../michell" }
michell-cli = { path = "../michell-cli" }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
tiny_http = "0.12"
