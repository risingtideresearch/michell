<text class="f" x="1740" y="82" xml:space="preserve">vendor family variant</text>
<text class="f" x="1740" y="97" xml:space="preserve">kv kt pole_pairs</text>
<text class="f" x="1740" y="112" xml:space="preserve">p_cont_kw tq_cont_nm</text>
<text class="f" x="1740" y="127" xml:space="preserve">mass_kg rpm_max eff</text>
<rect class="card" x="206" y="456" width="240" height="110" rx="8"/>
<path class="hdr" d="M207,482 V464 a7,7 0 0 1 7,-7 H438 a7,7 0 0 1 7,7 V482 Z"/>
<line x1="206" y1="482" x2="446" y2="482" stroke="#1d2528" stroke-width="0.8"/>
<text class="ht" x="216" y="474">statics</text>
<text class="f link" x="216" y="498" xml:space="preserve">→ hull | → case</text>
<text class="f" x="216" y="513" xml:space="preserve">hydrostatics: volume lcb …</text>
<text class="f" x="216" y="528" xml:space="preserve">at_rest: sinkage trim_deg</text>
<text class="f" x="216" y="543" xml:space="preserve">roll: gm_t period</text>
<text class="f" x="216" y="558" xml:space="preserve">gz: gz[] max_gz vanishing_deg</text>
<rect class="card" x="460" y="456" width="200" height="110" rx="8"/>
<path class="hdr" d="M461,482 V464 a7,7 0 0 1 7,-7 H652 a7,7 0 0 1 7,7 V482 Z"/>
<line x1="460" y1="482" x2="660" y2="482" stroke="#1d2528" stroke-width="0.8"/>
<text class="ht" x="470" y="474">sections</text>
<text class="hs" x="650" y="474" text-anchor="end">at rest</text>
<text class="f link" x="470" y="498" xml:space="preserve">→ case</text>
<text class="f" x="470" y="513" xml:space="preserve">attitude: sinkage trim_deg</text>
<text class="f" x="470" y="528" xml:space="preserve">hulls[]: stations</text>
