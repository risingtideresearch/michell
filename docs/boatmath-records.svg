<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1980 880" width="1980" height="880" role="img">
<title>boatmath records, their main fields, and the commands between them</title>
<style>
.card { fill: #ffffff; stroke: #1d2528; stroke-width: 1.3; }
.hdr { fill: #eef1ee; }
.ht { font: 600 14px Menlo, monospace; fill: #1d2528; }
.hs { font: 11px Helvetica, Arial, sans-serif; fill: #7b8682; }
.f { font: 11px Menlo, monospace; fill: #33403c; }
.f.link { fill: #1f6f8b; }
.src { fill: #e7eef0; stroke: #1f6f8b; stroke-width: 1.3; stroke-dasharray: 5 3; }
.sink { fill: #f6ece1; stroke: #9a5b1e; stroke-width: 1.3; }
.nt { font: 600 15px Menlo, monospace; fill: #1d2528; text-anchor: middle; }
.nt.sink { fill: #9a5b1e; }
.ns { font: 11px Helvetica, Arial, sans-serif; fill: #7b8682; text-anchor: middle; }
.e { stroke: #1d2528; stroke-width: 1.4; fill: none; }
.e.ref { stroke: #7b8682; stroke-dasharray: 4 4; }
.e.sink { stroke: #9a5b1e; stroke-dasharray: 2 3; }
.e.par { stroke: #1f6f8b; }
.lbl { font: 12px Menlo, monospace; fill: #1d2528; text-anchor: middle; paint-order: stroke; stroke: #f6f7f4; stroke-width: 5px; stroke-linejoin: round; }
.lbl.ref { fill: #7b8682; }
.lbl.par { fill: #1f6f8b; font-weight: 600; }
.lbl.small { font: 10px Helvetica, Arial, sans-serif; fill: #1f6f8b; }
.lbl.end { text-anchor: end; }
.grp { fill: #eef1ee; stroke: #5d6b66; stroke-width: 1.2; stroke-dasharray: 6 4; }
.gcap { font: 11px Helvetica, Arial, sans-serif; fill: #5d6b66; text-anchor: middle; }
.leg { font: 12px Helvetica, Arial, sans-serif; fill: #5d6b66; }
.start { fill: #1d2528; }
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#1d2528"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#7b8682"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#9a5b1e"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#1f6f8b"/></marker></defs>
<rect x="0" y="0" width="1980" height="880" fill="#f6f7f4"/>
<rect class="grp" x="990" y="214" width="372" height="300" rx="12"/>
<text class="gcap" x="1176" y="504">written together by run</text>
<rect class="grp" x="190" y="440" width="486" height="160" rx="12"/>
<text class="gcap" x="433" y="590">written together by statics (sections: for a case)</text>
<line class="e" x1="140" y1="289.0" x2="197" y2="289.0" marker-end="url(#a)"/>
