<text class="lbl ref" x="720" y="196">mount --stock</text>
<line class="e" x1="1680" y1="92" x2="1727" y2="92" marker-end="url(#a)"/>
<text class="lbl" x="1704" y="82">motors</text>
<circle class="start" cx="1674" cy="92" r="5"/>
<line class="e ref" x1="1840" y1="152" x2="1840" y2="227" marker-end="url(#ar)"/>
<text class="lbl ref" x="1890" y="196">match uses</text>
<line class="e" x1="1545" y1="166" x2="1545" y2="227" marker-end="url(#a)"/>
<text class="lbl" x="1600" y="200">prop --thrust</text>
<circle class="start" cx="1545" cy="160" r="5"/>
<path class="e par" d="M270,230 C260,168 342,168 332,227" marker-end="url(#ap)"/>
<text class="lbl par" x="301" y="174">scale</text>
<text class="lbl small" x="301" y="188">parent →</text>
<path class="e par" d="M540,230 C530,168 612,168 602,227" marker-end="url(#ap)"/>
<text class="lbl par" x="571" y="174">mount</text>
<text class="lbl small" x="571" y="188">parent →</text>
<line class="e" x1="305" y1="364" x2="330" y2="437" marker-end="url(#a)"/>
<text class="lbl" x="292" y="410">statics</text>
<line class="e" x1="575" y1="348" x2="550" y2="437" marker-end="url(#a)"/>
<text class="lbl" x="590" y="400">statics</text>
<line class="e sink" x1="676" y1="560" x2="987" y2="754" marker-end="url(#as)"/>
