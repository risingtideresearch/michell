<text class="nt" x="80" y="287.0">IGES · STL</text>
<text class="ns" x="80" y="303.0">file</text>
<rect class="card" x="200" y="230" width="210" height="134" rx="8"/>
<path class="hdr" d="M201,256 V238 a7,7 0 0 1 7,-7 H402 a7,7 0 0 1 7,7 V256 Z"/>
<line x1="200" y1="256" x2="410" y2="256" stroke="#1d2528" stroke-width="0.8"/>
<text class="ht" x="210" y="248">hull</text>
<text class="f link" x="210" y="272" xml:space="preserve">→ parent (scaled from)</text>
<text class="f" x="210" y="287" xml:space="preserve">name</text>
<text class="f" x="210" y="302" xml:space="preserve">source: path sha256</text>
<text class="f" x="210" y="317" xml:space="preserve">  waterline units</text>
<text class="f" x="210" y="332" xml:space="preserve">cut: stations rays</text>
<text class="f" x="210" y="347" xml:space="preserve">geometry: patches (JSON)</text>
<rect class="card" x="470" y="230" width="210" height="118" rx="8"/>
<path class="hdr" d="M471,256 V238 a7,7 0 0 1 7,-7 H672 a7,7 0 0 1 7,7 V256 Z"/>
<line x1="470" y1="256" x2="680" y2="256" stroke="#1d2528" stroke-width="0.8"/>
<text class="ht" x="480" y="248">case</text>
<text class="f link" x="480" y="272" xml:space="preserve">→ hull  → parent</text>
<text class="f" x="480" y="287" xml:space="preserve">name</text>
<text class="f" x="480" y="302" xml:space="preserve">params: span mass lcg vcg</text>
<text class="f" x="480" y="317" xml:space="preserve">  kxx kyy kzz roll_damping</text>
<text class="f" x="480" y="332" xml:space="preserve">  mount: kind leg pod …</text>
<rect class="card" x="740" y="230" width="200" height="118" rx="8"/>
<path class="hdr" d="M741,256 V238 a7,7 0 0 1 7,-7 H932 a7,7 0 0 1 7,7 V256 Z"/>
<line x1="740" y1="256" x2="940" y2="256" stroke="#1d2528" stroke-width="0.8"/>
<text class="ht" x="750" y="248">study</text>
<text class="f link" x="750" y="272" xml:space="preserve">→ case</text>
<text class="f" x="750" y="287" xml:space="preserve">kind: calm | waves</text>
<text class="f" x="750" y="302" xml:space="preserve">params: froude dynamic</text>
<text class="f" x="750" y="317" xml:space="preserve">  closure grid waves</text>
<rect class="card" x="1005" y="230" width="342" height="118" rx="8"/>
<path class="hdr" d="M1006,256 V238 a7,7 0 0 1 7,-7 H1339 a7,7 0 0 1 7,7 V256 Z"/>
<line x1="1005" y1="256" x2="1347" y2="256" stroke="#1d2528" stroke-width="0.8"/>
<text class="ht" x="1015" y="248">result</text>
<text class="f link" x="1015" y="272" xml:space="preserve">→ study  → field  → sections</text>
<text class="f" x="1015" y="287" xml:space="preserve">kind froude speed</text>
<text class="f" x="1015" y="302" xml:space="preserve">forces: rt rw rv pe ct</text>
<text class="f" x="1015" y="317" xml:space="preserve">  sinkage trim_deg r_appendages…</text>
<text class="f" x="1015" y="332" xml:space="preserve">self_propelled: thrust drives</text>
<rect class="card" x="1005" y="366" width="166" height="112" rx="8"/>
<path class="hdr" d="M1006,392 V374 a7,7 0 0 1 7,-7 H1163 a7,7 0 0 1 7,7 V392 Z"/>
<line x1="1005" y1="392" x2="1171" y2="392" stroke="#1d2528" stroke-width="0.8"/>
