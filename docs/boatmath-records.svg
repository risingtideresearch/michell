<text class="f link" x="1015" y="408" xml:space="preserve">→ study</text>
<text class="f" x="1015" y="423" xml:space="preserve">surface: x0 x1 nx</text>
<text class="f" x="1015" y="438" xml:space="preserve">  y0 y1 ny zeta</text>
<text class="f" x="1015" y="453" xml:space="preserve">hulls[]: x depth cp</text>
<rect class="card" x="1181" y="366" width="166" height="112" rx="8"/>
<path class="hdr" d="M1182,392 V374 a7,7 0 0 1 7,-7 H1339 a7,7 0 0 1 7,7 V392 Z"/>
<line x1="1181" y1="392" x2="1347" y2="392" stroke="#1d2528" stroke-width="0.8"/>
<text class="ht" x="1191" y="384">sections</text>
<text class="hs" x="1337" y="384" text-anchor="end">at speed</text>
<text class="f link" x="1191" y="408" xml:space="preserve">→ case</text>
<text class="f" x="1191" y="423" xml:space="preserve">attitude: sinkage</text>
<text class="f" x="1191" y="438" xml:space="preserve">  trim_deg</text>
<text class="f" x="1191" y="453" xml:space="preserve">hulls[]: stations</text>
<text class="f" x="1191" y="468" xml:space="preserve">  (exact polar)</text>
<rect class="card" x="1420" y="230" width="250" height="118" rx="8"/>
<path class="hdr" d="M1421,256 V238 a7,7 0 0 1 7,-7 H1662 a7,7 0 0 1 7,7 V256 Z"/>
<line x1="1420" y1="256" x2="1670" y2="256" stroke="#1d2528" stroke-width="0.8"/>
<text class="ht" x="1430" y="248">prop</text>
<text class="f link" x="1430" y="272" xml:space="preserve">→ result (or none)</text>
<text class="f" x="1430" y="287" xml:space="preserve">inputs: speed thrust shafts</text>
<text class="f" x="1430" y="302" xml:space="preserve">  wake thrust_deduction d_max</text>
<text class="f" x="1430" y="317" xml:space="preserve">best: rpm Z D PD EAR eta0</text>
<text class="f" x="1430" y="332" xml:space="preserve">curve[] interaction thrust_line</text>
<rect class="card" x="1730" y="230" width="220" height="118" rx="8"/>
<path class="hdr" d="M1731,256 V238 a7,7 0 0 1 7,-7 H1942 a7,7 0 0 1 7,7 V256 Z"/>
<line x1="1730" y1="256" x2="1950" y2="256" stroke="#1d2528" stroke-width="0.8"/>
<text class="ht" x="1740" y="248">drive</text>
<text class="f link" x="1740" y="272" xml:space="preserve">→ prop  → motor</text>
<text class="f" x="1740" y="287" xml:space="preserve">rank ratio rpm</text>
<text class="f" x="1740" y="302" xml:space="preserve">P_elec P_shaft eta</text>
<text class="f" x="1740" y="317" xml:space="preserve">I_dc V_bus</text>
<text class="f" x="1740" y="332" xml:space="preserve">propeller: Z D PD</text>
<rect class="card" x="745" y="40" width="210" height="94" rx="8"/>
<path class="hdr" d="M746,66 V48 a7,7 0 0 1 7,-7 H947 a7,7 0 0 1 7,7 V66 Z"/>
<line x1="745" y1="66" x2="955" y2="66" stroke="#1d2528" stroke-width="0.8"/>
<text class="ht" x="755" y="58">stock_mount</text>
<text class="f" x="755" y="82" xml:space="preserve">vendor model kind</text>
<text class="f" x="755" y="97" xml:space="preserve">leg pod shaft_depth</text>
<text class="f" x="755" y="112" xml:space="preserve">prop_diameter power_kw</text>
<text class="f" x="755" y="127" xml:space="preserve">sources[]</text>
<rect class="card" x="1730" y="40" width="220" height="94" rx="8"/>
<path class="hdr" d="M1731,66 V48 a7,7 0 0 1 7,-7 H1942 a7,7 0 0 1 7,7 V66 Z"/>
<line x1="1730" y1="66" x2="1950" y2="66" stroke="#1d2528" stroke-width="0.8"/>
