<text class="lbl" x="710.0" y="279.0">study</text>
<line class="e" x1="940" y1="289.0" x2="987" y2="289.0" marker-end="url(#a)"/>
<text class="lbl" x="965.0" y="279.0">run</text>
<line class="e" x1="1362" y1="289.0" x2="1417" y2="289.0" marker-end="url(#a)"/>
<text class="lbl" x="1391.0" y="279.0">prop</text>
